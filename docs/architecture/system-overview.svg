<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="system-title system-desc">
<title id="system-title">How Agentic Stock Contributor works on any contributor machine</title>
<desc id="system-desc">Five roles show the contributor, AI agent, local deterministic toolkit, Chrome bridge and Adobe Stock, plus optional image providers and the durable workspace artifacts.</desc>
<defs><style>.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536078"/></marker>
<marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2e5aa8"/></marker></defs>
<rect width="1800" height="1000" fill="#f7f6f2"/>
<text x="55" y="68" class="sans" font-size="38" font-weight="780" fill="#232838" text-anchor="start">What happens when you ask an agent to run a stock workflow</text>
<text x="55" y="106" class="sans" font-size="20" font-weight="500" fill="#536078" text-anchor="start">One local toolkit coordinates evidence, files and browser work. Your agent and providers remain replaceable.</text>
<path d="M355 360H400" stroke="#536078" stroke-width="3" marker-end="url(#arr)"/><path d="M700 360H745" stroke="#536078" stroke-width="3" marker-end="url(#arr)"/><path d="M1105 360H1150" stroke="#536078" stroke-width="3" marker-end="url(#arr)"/><path d="M1450 360H1495" stroke="#536078" stroke-width="3" marker-end="url(#arr)"/><rect x="55" y="190" width="300" height="500" rx="18" fill="#fff1ea" stroke="#eb6c36" stroke-width="1.5"/><rect x="73" y="208" width="96" height="28" rx="14" fill="#f0f1f4"/><text x="121.0" y="227" class="mono" font-size="12" font-weight="700" fill="#eb6c36" text-anchor="middle">OWNER</text><text x="73" y="272" class="sans" font-size="25" font-weight="760" fill="#232838" text-anchor="start">You</text><circle cx="80" cy="311" r="5" fill="#eb6c36"/><text x="97" y="316" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Define the business goal</text><circle cx="80" cy="361" r="5" fill="#eb6c36"/><text x="97" y="366" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Choose account and provider</text><circle cx="80" cy="411" r="5" fill="#eb6c36"/><text x="97" y="416" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Approve direction and risk</text><circle cx="80" cy="461" r="5" fill="#eb6c36"/><text x="97" y="466" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Click Submit yourself</text><rect x="400" y="190" width="300" height="500" rx="18" fill="#edf3ff" stroke="#2e5aa8" stroke-width="1.5"/><rect x="418" y="208" width="96" height="28" rx="14" fill="#f0f1f4"/><text x="466.0" y="227" class="mono" font-size="12" font-weight="700" fill="#2e5aa8" text-anchor="middle">JUDGMENT</text><text x="418" y="272" class="sans" font-size="25" font-weight="760" fill="#232838" text-anchor="start">AI agent</text><circle cx="425" cy="311" r="5" fill="#2e5aa8"/><text x="442" y="316" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Read the skill + know-how</text><circle cx="425" cy="361" r="5" fill="#2e5aa8"/><text x="442" y="366" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Propose queries and concepts</text><circle cx="425" cy="411" r="5" fill="#2e5aa8"/><text x="442" y="416" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Call only needed stock_* tools</text><circle cx="425" cy="461" r="5" fill="#2e5aa8"/><text x="442" y="466" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Draft prompts and metadata</text><rect x="745" y="150" width="360" height="580" rx="18" fill="#edf8f2" stroke="#34785a" stroke-width="1.5"/><rect x="763" y="168" width="96" height="28" rx="14" fill="#f0f1f4"/><text x="811.0" y="187" class="mono" font-size="12" font-weight="700" fill="#34785a" text-anchor="middle">DETERMINISTIC</text><text x="763" y="232" class="sans" font-size="25" font-weight="760" fill="#232838" text-anchor="start">Local toolkit</text><circle cx="770" cy="271" r="5" fill="#34785a"/><text x="787" y="276" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Measure supply and outcomes</text><circle cx="770" cy="321" r="5" fill="#34785a"/><text x="787" y="326" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Run durable paced jobs</text><circle cx="770" cy="371" r="5" fill="#34785a"/><text x="787" y="376" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Create evidence and gates</text><circle cx="770" cy="421" r="5" fill="#34785a"/><text x="787" y="426" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Hash files, CSV and plan</text><circle cx="770" cy="471" r="5" fill="#34785a"/><text x="787" y="476" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Verify staging and metadata</text><rect x="1150" y="190" width="300" height="500" rx="18" fill="#edf3ff" stroke="#2e5aa8" stroke-width="1.5"/><rect x="1168" y="208" width="96" height="28" rx="14" fill="#f0f1f4"/><text x="1216.0" y="227" class="mono" font-size="12" font-weight="700" fill="#2e5aa8" text-anchor="middle">BROWSER</text><text x="1168" y="272" class="sans" font-size="25" font-weight="760" fill="#232838" text-anchor="start">Chrome bridge</text><circle cx="1175" cy="311" r="5" fill="#2e5aa8"/><text x="1192" y="316" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Read public Adobe pages</text><circle cx="1175" cy="361" r="5" fill="#2e5aa8"/><text x="1192" y="366" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Read contributor outcomes</text><circle cx="1175" cy="411" r="5" fill="#2e5aa8"/><text x="1192" y="416" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Stage verified files only</text><circle cx="1175" cy="461" r="5" fill="#2e5aa8"/><text x="1192" y="466" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Set guarded metadata</text><circle cx="1175" cy="511" r="5" fill="#2e5aa8"/><text x="1192" y="516" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Never Submit or Delete</text><rect x="1495" y="190" width="250" height="500" rx="18" fill="#ffffff" stroke="#232838" stroke-width="1.5"/><rect x="1513" y="208" width="96" height="28" rx="14" fill="#f0f1f4"/><text x="1561.0" y="227" class="mono" font-size="12" font-weight="700" fill="#232838" text-anchor="middle">EXTERNAL</text><text x="1513" y="272" class="sans" font-size="25" font-weight="760" fill="#232838" text-anchor="start">Adobe Stock</text><circle cx="1520" cy="311" r="5" fill="#232838"/><text x="1537" y="316" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Market pages</text><circle cx="1520" cy="361" r="5" fill="#232838"/><text x="1537" y="366" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Contributor portal</text><circle cx="1520" cy="411" r="5" fill="#232838"/><text x="1537" y="416" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Moderation outcomes</text><circle cx="1520" cy="461" r="5" fill="#232838"/><text x="1537" y="466" class="sans" font-size="17" font-weight="600" fill="#536078" text-anchor="start">Downloads and earnings</text><path d="M1620 700V760H925V730" stroke="#2e5aa8" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/><text x="1270" y="785" class="mono" font-size="13" font-weight="700" fill="#2e5aa8" text-anchor="middle">Measured evidence and outcomes return to the local workspace</text><rect x="400" y="760" width="300" height="116" rx="16" fill="#ffffff" stroke="#d8dbe2" stroke-dasharray="7 5"/><rect x="418" y="778" width="88" height="28" rx="14" fill="#f0f1f4"/><text x="462.0" y="797" class="mono" font-size="12" font-weight="700" fill="#7d8799" text-anchor="middle">OPTIONAL</text><text x="418" y="832" class="sans" font-size="20" font-weight="740" fill="#232838" text-anchor="start">Generator / upscaler</text><text x="418" y="858" class="sans" font-size="14" font-weight="600" fill="#536078" text-anchor="start">User-selected adapter</text><path d="M550 690V750" stroke="#536078" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arr)"/><rect x="745" y="808" width="760" height="128" rx="18" fill="#ffffff" stroke="#d8dbe2"/><text x="770" y="842" class="mono" font-size="12" font-weight="800" fill="#7d8799" text-anchor="start">DURABLE WORKSPACE</text><rect x="770" y="862" width="112" height="28" rx="14" fill="#edf3ff"/><text x="826.0" y="881" class="mono" font-size="12" font-weight="700" fill="#2e5aa8" text-anchor="middle">REPORT.md</text><rect x="894" y="862" width="172" height="28" rx="14" fill="#f0f1f4"/><text x="980.0" y="881" class="mono" font-size="12" font-weight="700" fill="#536078" text-anchor="middle">registry + prompts</text><rect x="1078" y="862" width="156" height="28" rx="14" fill="#fff1ea"/><text x="1156.0" y="881" class="mono" font-size="12" font-weight="700" fill="#eb6c36" text-anchor="middle">raw / final / QC</text><rect x="1246" y="862" width="124" height="28" rx="14" fill="#edf8f2"/><text x="1308.0" y="881" class="mono" font-size="12" font-weight="700" fill="#34785a" text-anchor="middle">metadata.csv</text><rect x="1382" y="862" width="112" height="28" rx="14" fill="#edf8f2"/><text x="1438.0" y="881" class="mono" font-size="12" font-weight="700" fill="#34785a" text-anchor="middle">plan.json</text><rect x="1506" y="862" width="204" height="28" rx="14" fill="#edf3ff"/><text x="1608.0" y="881" class="mono" font-size="12" font-weight="700" fill="#2e5aa8" text-anchor="middle">STATE · LOG · PLAYBOOK</text><rect x="55" y="808" width="300" height="128" rx="18" fill="#fff1ea" stroke="#eb6c36" stroke-width="2"/><text x="78" y="844" class="mono" font-size="12" font-weight="800" fill="#eb6c36" text-anchor="start">HUMAN-ONLY ACTION</text><text x="78" y="884" class="sans" font-size="25" font-weight="780" fill="#232838" text-anchor="start">Submit files</text><text x="78" y="912" class="sans" font-size="15" font-weight="650" fill="#536078" text-anchor="start">The toolkit cannot click it.</text><path d="M205 690V798" stroke="#eb6c36" stroke-width="3" marker-end="url(#arr)"/></svg>