[project]
name = "adobe-stock-analytics"
version = "0.11.0"
description = "Chrome extension, MCP server, skill and playbook that help AI agents run an Adobe Stock contributor workflow"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
adobe-stock-analytics = "adobe_stock_analytics.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
